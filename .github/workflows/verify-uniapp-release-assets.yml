name: Verify UniApp Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable UniApp UTS product version whose ZIP is already attached to the matching GitHub Release
        required: true
        type: string
      uts_sha256:
        description: SHA-256 accepted during UTS device and Marketplace verification
        required: true
        type: string
      include_legacy:
        description: Also verify the separately accepted App native-plugin compatibility ZIP
        required: true
        default: false
        type: boolean
      legacy_sha256:
        description: Required only when include_legacy is enabled
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate immutable candidate inputs
        env:
          VERSION: ${{ inputs.version }}
          UTS_SHA256: ${{ inputs.uts_sha256 }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy }}
          LEGACY_SHA256: ${{ inputs.legacy_sha256 }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable semantic versions are verifiable: ${VERSION}" >&2
            exit 1
          fi
          if [[ ! "${UTS_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "UTS SHA-256 is invalid." >&2
            exit 1
          fi
          if [[ "${INCLUDE_LEGACY}" == "true" && ! "${LEGACY_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Legacy SHA-256 is required when legacy verification is enabled." >&2
            exit 1
          fi
          if [[ "${INCLUDE_LEGACY}" != "true" && -n "${LEGACY_SHA256}" ]]; then
            echo "Do not provide a legacy SHA-256 unless legacy verification is enabled." >&2
            exit 1
          fi

      - name: Check out the public release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: verifier

      - name: Check out the canonical release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0

      - name: Resolve target and native provenance versions
        env:
          VERSION: ${{ inputs.version }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy }}
        run: |
          read -r SOURCE_UTS_VERSION NATIVE_VERSION LEGACY_VERSION < <(
            ruby -ryaml -e '
              manifest = YAML.load_file("release-source/plugin.yaml")
              root_version = manifest.fetch("version")
              targets = manifest.fetch("targets")
              uts = targets.find { |target| target.fetch("id") == "uniapp" }
              abort("UniApp target is missing") unless uts
              constraints = uts.fetch("constraints", []).select do |constraint|
                constraint.fetch("name") == "native-release-version"
              end
              abort("Multiple native-release-version constraints") if constraints.length > 1
              native_version = constraints.empty? ? root_version : constraints.fetch(0).fetch("value")
              legacy = targets.find { |target| target.fetch("id") == "uniapp-native-compat" }
              puts [
                uts.fetch("version", root_version),
                native_version,
                legacy ? legacy.fetch("version", root_version) : root_version,
              ].join(" ")
            '
          )
          if [[ "${SOURCE_UTS_VERSION}" != "${VERSION}" ]]; then
            echo "Release source declares UniApp ${SOURCE_UTS_VERSION}, not ${VERSION}." >&2
            exit 1
          fi
          if [[ "${INCLUDE_LEGACY}" == "true" && "${LEGACY_VERSION}" != "${VERSION}" ]]; then
            echo "Legacy ${LEGACY_VERSION} must be audited from its own release workflow, not UniApp ${VERSION}." >&2
            exit 1
          fi
          echo "NATIVE_VERSION=${NATIVE_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Java archive inspection
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JavaScript contract verification
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download accepted public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy }}
        run: |
          mkdir -p dist
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "levixel-uniapp-${VERSION}.zip" \
            --pattern "levixel-uniapp-${VERSION}.zip.sha256" \
            --dir dist
          gh release download "${NATIVE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "levixel-native-${NATIVE_VERSION}.json" \
            --pattern "levixel-${NATIVE_VERSION}.aar" \
            --pattern "levixel-${NATIVE_VERSION}.xcframework.zip" \
            --dir dist
          if [[ "${INCLUDE_LEGACY}" == "true" ]]; then
            gh release download "${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "levixel-uniapp-legacy-${VERSION}.zip" \
              --pattern "levixel-uniapp-legacy-${VERSION}.zip.sha256" \
              --dir dist
          fi

      - name: Verify exact UniApp release bytes and provenance
        env:
          VERSION: ${{ inputs.version }}
          UTS_SHA256: ${{ inputs.uts_sha256 }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy }}
          LEGACY_SHA256: ${{ inputs.legacy_sha256 }}
        run: |
          arguments=(
            "${VERSION}"
            "${NATIVE_VERSION}"
            release-source
            "dist/levixel-native-${NATIVE_VERSION}.json"
            "dist/levixel-${NATIVE_VERSION}.aar"
            "dist/levixel-${NATIVE_VERSION}.xcframework.zip"
            "dist/levixel-uniapp-${VERSION}.zip"
            "dist/levixel-uniapp-${VERSION}.zip.sha256"
            "${UTS_SHA256}"
          )
          if [[ "${INCLUDE_LEGACY}" == "true" ]]; then
            arguments+=(
              "dist/levixel-uniapp-legacy-${VERSION}.zip"
              "dist/levixel-uniapp-legacy-${VERSION}.zip.sha256"
              "${LEGACY_SHA256}"
            )
          fi
          verifier/.github/scripts/verify-uniapp-release-assets.sh "${arguments[@]}"
