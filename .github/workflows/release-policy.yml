name: Release policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Candidate policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify HarmonyOS source contracts and geometry
        run: node --test scripts/test-harmonyos-viewer-context.mjs
      - name: Verify release policy and scripts
        run: |
          ruby -c scripts/release-policy.rb
          ruby -c scripts/snapshot-release-candidate.rb
          ruby -c scripts/verify-publish-candidate.rb
          ruby -c scripts/verify-react-native-ios-lifecycle.rb
          ruby -c scripts/native-release-manifest.rb
          ruby -c scripts/compute-ios-source-digest.rb
          ruby -c scripts/test-ios-source-digest.rb
          bash -n scripts/verify-ios-xcframework-provenance.sh
          bash -n scripts/verify-native-manifest-ios-provenance.sh
          bash -n scripts/prepare-release-candidate.sh
          ruby scripts/verify-react-native-ios-lifecycle.rb
          ruby scripts/test-ios-source-digest.rb
          ruby scripts/test-native-release-manifest.rb
          ruby scripts/test-release-policy.rb
          ruby scripts/test-native-artifact-reuse.rb
          ruby scripts/test-acceptance-reuse.rb
          ruby scripts/test-maven-reuse.rb
          ruby -c scripts/reuse-native-artifacts.rb
          bash -n scripts/prepare-native-release.sh
          bash -n scripts/publish-react-native.sh
