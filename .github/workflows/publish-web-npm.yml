name: Publish Web npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Levixel Web version attached to the canonical GitHub Release
        required: true
        type: string
      sha256:
        description: SHA-256 accepted during artifact-only browser verification
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate immutable candidate inputs
        env:
          VERSION: ${{ inputs.version }}
          ACCEPTED_SHA256: ${{ inputs.sha256 }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable semantic versions are publishable: ${VERSION}" >&2
            exit 1
          fi
          if [[ ! "${ACCEPTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Accepted Web SHA-256 is invalid." >&2
            exit 1
          fi

      - name: Check out the public release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: verifier

      - name: Check out the canonical release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0

      - name: Set up JavaScript package verification
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm
          cache-dependency-path: release-source/adapters/web/package-lock.json

      - name: Verify tag source and build an independent comparison
        working-directory: release-source/adapters/web
        run: |
          npm ci
          npm test

      - name: Download accepted public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "levixel-web-${VERSION}.tgz" \
            --pattern "levixel-web-${VERSION}.tgz.sha256" \
            --dir dist

      - name: Verify exact Web release bytes and provenance
        env:
          VERSION: ${{ inputs.version }}
          ACCEPTED_SHA256: ${{ inputs.sha256 }}
        run: |
          verifier/.github/scripts/verify-web-package.sh \
            "${VERSION}" \
            release-source \
            "dist/levixel-web-${VERSION}.tgz" \
            "dist/levixel-web-${VERSION}.tgz.sha256" \
            "${ACCEPTED_SHA256}" \
            --require-tag

      - name: Confirm the npm version is unused
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          view_output="$(npm view "@sandrox/levixel-web@${VERSION}" version \
            --registry https://registry.npmjs.org/ 2>&1)"
          view_status=$?
          set -e
          if [[ ${view_status} -eq 0 ]]; then
            echo "@sandrox/levixel-web@${VERSION} is already published." >&2
            exit 1
          fi
          if ! grep -q 'E404' <<<"${view_output}"; then
            echo "Could not prove that @sandrox/levixel-web@${VERSION} is unused:" >&2
            echo "${view_output}" >&2
            exit 1
          fi

      - name: Set up an OIDC-capable npm client
        run: npm install --global npm@11.17.0

      - name: Publish the verified package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm publish "./dist/levixel-web-${VERSION}.tgz" \
            --access public \
            --provenance \
            --registry https://registry.npmjs.org/
