name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Levixel version attached to a public release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable semantic versions are publishable: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check out the public release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: verifier

      - name: Check out the canonical release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0

      - name: Download accepted public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "levixel-react-native-${VERSION}.tgz" \
            --pattern "levixel-react-native-${VERSION}.tgz.sha256" \
            --pattern "levixel-native-${VERSION}.json" \
            --pattern "levixel-${VERSION}.xcframework.zip" \
            --dir dist
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            --output "dist/levixel-${VERSION}.aar" \
            "https://repo1.maven.org/maven2/io/gitee/sandrox/levixel/${VERSION}/levixel-${VERSION}.aar"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Verify exact package and native cores
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          verifier/.github/scripts/verify-npm-package.sh \
            "${VERSION}" \
            "dist/levixel-react-native-${VERSION}.tgz" \
            "dist/levixel-react-native-${VERSION}.tgz.sha256" \
            "dist/levixel-native-${VERSION}.json" \
            "dist/levixel-${VERSION}.aar" \
            "dist/levixel-${VERSION}.xcframework.zip" \
            release-source

      - name: Confirm the npm version is unused
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set +e
          view_output="$(npm view "@sandrox/levixel@${VERSION}" version \
            --registry https://registry.npmjs.org/ 2>&1)"
          view_status=$?
          set -e
          if [[ ${view_status} -eq 0 ]]; then
            echo "@sandrox/levixel@${VERSION} is already published." >&2
            exit 1
          fi
          if ! grep -q 'E404' <<<"${view_output}"; then
            echo "Could not prove that @sandrox/levixel@${VERSION} is unused:" >&2
            echo "${view_output}" >&2
            exit 1
          fi

      - name: Set up an OIDC-capable npm client
        run: npm install --global npm@11.17.0

      - name: Publish verified package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm publish "./dist/levixel-react-native-${VERSION}.tgz" \
            --access public \
            --provenance \
            --registry https://registry.npmjs.org/
