name: Verify Web

on:
  pull_request:
    paths:
      - 'adapters/web/**'
      - 'contract/**'
      - 'plugin.yaml'
      - 'schema/plugin-manifest.schema.yaml'
      - 'scripts/verify-release-metadata.sh'
      - 'scripts/package-web.sh'
      - 'scripts/verify-web-package.sh'
      - 'scripts/verify-web.sh'
      - '.github/scripts/verify-web-package.sh'
      - '.github/workflows/verify-web.yml'
  push:
    branches:
      - master
    paths:
      - 'adapters/web/**'
      - 'contract/**'
      - 'plugin.yaml'
      - 'schema/plugin-manifest.schema.yaml'
      - 'scripts/verify-release-metadata.sh'
      - 'scripts/package-web.sh'
      - 'scripts/verify-web-package.sh'
      - 'scripts/verify-web.sh'
      - '.github/scripts/verify-web-package.sh'
      - '.github/workflows/verify-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: adapters/web/package-lock.json

      - name: Install locked Web tooling
        working-directory: adapters/web
        run: npm ci

      - name: Verify Web source and npm payload layout
        run: ./scripts/verify-web.sh
