# yaml-language-server: $schema=../../standards/plugin-manifest.schema.yaml

schemaVersion: 1
id: levixel
displayName: Levixel
version: 0.1.0
summary: Shared-transition image and video viewer for native, React Native, UniApp, and web applications.

contract:
  version: 1
  schema: contract/open.schema.json

provenance:
  repository: https://gitee.com/chrisJxc/native-plugins.git
  commit: 3285cc933e04c1772acb4c9e3b5610ae8cee86a5
  paths:
    - Android/Galeria
    - Harmony/Galeria
    - IOS/galeria
    - ReactNativePlugins/galeria
    - UniappNativePlugins/ChrisUniPlugin-Galeria

targets:
  - id: native-android
    kind: native
    platform: android
    sourceRoot: native/android/levixel
    capabilities:
      - drag-dismiss
      - horizontal-paging
      - image-viewing
      - pan
      - pinch-zoom
      - shared-transition
      - video-viewing
    build:
      command: ./scripts/package-native-android.sh
    verify:
      commands:
        - ./scripts/verify-native-android.sh
    artifacts:
      - id: aar
        format: aar
        output: dist/native-android/levixel-0.1.0.aar
        distribution:
          channel: github-release
          packageId: com.sandrox.levixel:levixel
    constraints:
      - name: minimum-sdk
        value: 21
  - id: native-ios
    kind: native
    platform: ios
    sourceRoot: native/ios/Levixel
    capabilities:
      - drag-dismiss
      - horizontal-paging
      - image-viewing
      - pan
      - pinch-zoom
      - shared-transition
      - video-viewing
    build:
      command: ./scripts/package-native-ios.sh
    verify:
      commands:
        - ./scripts/verify-native-ios.sh
    artifacts:
      - id: xcframework
        format: xcframework-zip
        output: dist/native-ios/levixel-0.1.0.xcframework.zip
        distribution:
          channel: github-release
          packageId: com.sandrox.levixel
    constraints:
      - name: minimum-ios
        value: '13.0'
  - id: native-harmonyos
    kind: native
    platform: harmonyos
    sourceRoot: native/harmonyos/levixel
    capabilities:
      - drag-dismiss
      - horizontal-paging
      - image-viewing
      - shared-transition
      - video-viewing
    build:
      command: ./scripts/package-native-harmonyos.sh
    verify:
      commands:
        - ./scripts/verify-native-harmonyos.sh
    artifacts:
      - id: har
        format: har
        output: dist/native-harmonyos/levixel-0.1.0.har
        distribution:
          channel: ohpm
          packageId: '@sandrox/levixel'
    constraints:
      - name: minimum-api
        value: 23
