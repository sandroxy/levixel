plugins {
    id "com.android.library"
}

def coreAarPath = providers.gradleProperty("levixelCoreAar").orNull
def dcloudUniappAarPath = providers.gradleProperty("dcloudUniappAar").orNull

if (!coreAarPath) {
    throw new GradleException("Missing -PlevixelCoreAar=/absolute/path/to/levixel.aar")
}
if (!dcloudUniappAarPath) {
    throw new GradleException("Missing -PdcloudUniappAar=/absolute/path/to/uniapp-v8-release.aar")
}

group = "com.sandrox.levixel"
version = rootProject.ext.levixelVersion

base {
    archivesName = "levixel-uniapp"
}

configurations {
    uniappBundledAars
}

android {
    namespace = "com.sandrox.levixel.uniapp"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly files(coreAarPath)
    compileOnly files(dcloudUniappAarPath)
    compileOnly "androidx.appcompat:appcompat:1.7.1"
    compileOnly "androidx.core:core:1.15.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation files(coreAarPath)
    uniappBundledAars "com.github.chrisbanes:PhotoView:2.3.0@aar"
}

tasks.register("copyUniappBundledAars", Copy) {
    from(configurations.uniappBundledAars)
    into(layout.buildDirectory.dir("uniapp-bundled-aars"))
}
