plugins {
    id "com.android.library"
}

def dcloudUniappAarPath = providers.gradleProperty("dcloudUniappAar").orNull

group = "com.sandrox.levixel"
version = rootProject.ext.levixelVersion

base {
    archivesName = "levixel-uniapp"
}

android {
    namespace = "com.sandrox.levixel.uniapp"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly project(":levixel-uniapp-runtime")
    if (dcloudUniappAarPath) {
        compileOnly files(dcloudUniappAarPath)
    }
    compileOnly "androidx.appcompat:appcompat:1.7.1"
    compileOnly "androidx.core:core:1.15.0"
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (!dcloudUniappAarPath) {
            throw new GradleException(
                    "Missing -PdcloudUniappAar=/absolute/path/to/uniapp-v8-release.aar"
            )
        }
    }
}
