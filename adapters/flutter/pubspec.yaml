name: sandrox_levixel
description: Native image and video viewing with shared thumbnail transitions for Android and iOS.
version: 1.5.0
publish_to: none
repository: https://github.com/sandroxy/levixel
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.sandrox.levixel.flutter
        pluginClass: LevixelPlugin
      ios:
        pluginClass: LevixelPlugin
