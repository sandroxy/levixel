<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Levixel browser fixture</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; min-height: 1600px; font-family: sans-serif; }
      #sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding: 40px; }
      button { aspect-ratio: 1; padding: 0; overflow: hidden; border: 0; border-radius: 12px; }
      img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div id="sources"></div>
    <script type="module">
      import {
        closeLevixel,
        onLevixelEvent,
        onLevixelSourceActivate,
        openLevixel,
        openLevixelFromSelector,
      } from '../dist/index.js';

      const svg = (width, height, color, label) =>
        `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="${color}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="48">${label}</text></svg>`)}`;
      const items = [
        { id: 'portrait', type: 'image', url: svg(1200, 1800, '#496d89', 'FULL A'), thumbnailUrl: svg(240, 360, '#496d89', 'A'), width: 1200, height: 1800, alt: 'Portrait' },
        { id: 'wide', type: 'image', url: svg(2400, 1600, '#9b624c', 'FULL B'), thumbnailUrl: svg(600, 400, '#9b624c', 'B'), width: 2400, height: 1600, alt: 'Wide Coast' },
        { id: 'video', type: 'video', url: 'data:video/mp4;base64,', posterUrl: svg(800, 450, '#465272', 'VIDEO'), width: 16, height: 9, alt: 'Video' },
      ];
      const sources = document.querySelector('#sources');
      const events = [];
      const results = [];
      onLevixelEvent(event => events.push(event));
      const open = async (index) => {
        const result = await openLevixelFromSelector({
          items,
          index,
          sourceSelector: '.source',
          sourceStyles: items.map(() => ({ objectFit: 'cover', cornerRadius: 12 })),
        });
        results.push(result);
        return result;
      };
      const openIdentifiedPrepend = async () => {
        const prepended = {
          id: 'prepended',
          type: 'image',
          url: svg(1200, 800, '#596b42', 'PREPENDED'),
          width: 1200,
          height: 800,
          alt: 'Prepended item without a mounted source',
        };
        const result = await openLevixelFromSelector({
          items: [prepended, ...items],
          initialItemId: 'wide',
          sourceBindings: [
            { itemId: 'video', selector: '[data-item-id="video"]', cornerRadius: 12 },
            { itemId: 'wide', selector: '[data-item-id="wide"]', cornerRadius: 12 },
          ],
        });
        results.push(result);
        return result;
      };
      const openIdentifiedAppend = async () => {
        const appended = {
          id: 'appended',
          type: 'image',
          url: svg(1200, 800, '#76547d', 'APPENDED'),
          thumbnailUrl: svg(300, 200, '#76547d', 'APPENDED'),
          width: 1200,
          height: 800,
          alt: 'Appended item',
        };
        let source = document.querySelector('[data-item-id="appended"]');
        if (!source) {
          source = document.createElement('button');
          source.className = 'appended-source';
          source.dataset.itemId = appended.id;
          const image = document.createElement('img');
          image.src = appended.thumbnailUrl;
          image.alt = appended.alt;
          source.append(image);
          sources.append(source);
        }
        const result = await openLevixelFromSelector({
          items: [...items, appended],
          initialItemId: appended.id,
          sourceBindings: [
            { itemId: appended.id, selector: '[data-item-id="appended"]', cornerRadius: 12 },
          ],
        });
        results.push(result);
        return result;
      };
      items.forEach((item, index) => {
        const button = document.createElement('button');
        button.className = 'source';
        button.dataset.index = String(index);
        button.dataset.itemId = item.id;
        const image = document.createElement('img');
        image.src = item.thumbnailUrl;
        image.alt = item.alt;
        button.append(image);
        onLevixelSourceActivate(button, () => void open(index));
        sources.append(button);
      });
      window.levixelFixture = {
        events,
        results,
        closeLevixel,
        openLevixel,
        openLevixelFromSelector,
        open,
        openIdentifiedAppend,
        openIdentifiedPrepend,
        items,
      };
    </script>
  </body>
</html>
